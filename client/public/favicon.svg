<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded Shield / Base -->
  <rect width="64" height="64" rx="16" fill="#0D0820"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#nsGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Neural Pulse / Brain Synapse Icon -->
  <path d="M22 32c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="url(#nsGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M27 32c0-2.761 2.239-5 5-5s5 2.239 5 5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- ECG / Wave Pulse Trace -->
  <path d="M14 42h10l4-8 8 16 5-10 4 3 5-1" stroke="#F472B6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Synapse Node -->
  <circle cx="32" cy="22" r="3.5" fill="#FFFFFF"/>
</svg>
